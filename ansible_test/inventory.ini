[gitlab_server]

192.168.2.98

[gitlab_runner]

192.168.2.97 

[all:vars]

# SSH 연결 시 호스트 키 체크를 비활성화합니다. (처음 연결 시 유용)
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# SSH 인증 정보 설정
# 방법 1: 비밀번호 인증 사용 시 (아래 주석 해제하고 값 입력)
# ansible_user=yoon
# ansible_ssh_pass=your_password_here

# 방법 2: SSH 키 인증 사용 시 (권장, 더 안전함)
ansible_user=yoon
ansible_ssh_private_key_file=/Users/yoon/.ssh/terraform_ssh

