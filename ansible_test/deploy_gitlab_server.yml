---
# Play: GitLab 서버 설치 (gitlab_server 그룹 VM 대상)
- name: Deploy GitLab CE Server
  hosts: gitlab_server
  become: yes  # 모든 작업을 sudo(root) 권한으로 실행

  vars:
    # GitLab에 접속할 URL을 변수로 지정합니다.
    gitlab_external_url: "http://yoongitlab.com"

  tasks:
    - name: 1. Install prerequisites (필수 패키지 설치)
      apt:
        name:
          - curl          # 패키지 다운로드용
          - ca-certificates  # SSL 인증서 검증용
          - gnupg         # 패키지 저장소 GPG 키 검증용 (필수)
          - openssh-server  # SSH 서버 (권장)
          - postfix       # 이메일 발송용 (선택사항, 필요시 주석 해제)
        state: present
        update_cache: yes

    - name: 2. Add GitLab package repository (GitLab 저장소 추가)
      shell: |
        curl -sS https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh | sudo bash
      args:
        # 이 명령어가 이미 실행되었으면 (파일이 존재하면) 건너뜀
        creates: /etc/apt/sources.list.d/gitlab_gitlab-ce.list

    - name: 3. Install GitLab CE (GitLab-CE 설치)
      apt:
        name: gitlab-ce
        state: present

    - name: 4. Wait for GitLab configuration file (설정 파일 생성 대기)
      wait_for:
        path: /etc/gitlab/gitlab.rb
        state: present
        timeout: 60

    - name: 5. Configure external_url (GitLab URL 설정)
      lineinfile:
        path: /etc/gitlab/gitlab.rb
        regexp: "^#?external_url"
        line: "external_url '{{ gitlab_external_url }}'"
        backup: yes
      notify: Run gitlab-ctl reconfigure # 설정 변경 시 reconfigure 실행 예약

  handlers:
    - name: Run gitlab-ctl reconfigure
      command: gitlab-ctl reconfigure
      listen: "Run gitlab-ctl reconfigure"

